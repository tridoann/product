version: '3.8'

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:14.18
    container_name: postgres_db
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pass1234!
      POSTGRES_DB: Product-Develop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    container_name: redis-server
    image: redis:7.2.4-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass d0e0EHg2mp15431btuYD5ZfM3n42evXNpLk83c
    volumes:
      - cache:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "d0e0EHg2mp15431btuYD5ZfM3n42evXNpLk83c", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product_api
    restart: always
    ports:
      - '8080:80'
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres_db;Port=5432;Database=Product-Develop;Username=postgres;Password=Pass1234!"
      ConnectionStrings__Redis: "redis-server:6379,password=d0e0EHg2mp15431btuYD5ZfM3n42evXNpLk83c"
      Jwt__SecretKey: "super-secret-jwt-key-at-least-32-chars!!"
      Jwt__Issuer: "product-api"
      Jwt__Audience: "product-client"
      Jwt__ExpiryMinutes: "1440"
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - app_network

  # ─── Frontend ──────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frond-end/my-react-app
      dockerfile: Dockerfile
    container_name: product_frontend
    restart: always
    ports:
      - '3000:80'
    environment:
      REACT_APP_API_URL: "http://localhost:8080"
    depends_on:
      - api
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  cache:
    driver: local

networks:
  app_network:
    driver: bridge
